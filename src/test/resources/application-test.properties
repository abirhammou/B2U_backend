# ?????????????????????????????????????????????????????????
# src/test/resources/application-test.properties
# Overrides application.properties during @ActiveProfiles("test")
# ?????????????????????????????????????????????????????????

# Override MongoDB URI ? use localhost (your real MongoDB)
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/b2u_test}

# Disable DataSeeder during tests (it tries to connect and fails)
spring.autoconfigure.exclude=

# Disable mail during tests
spring.mail.host=localhost
spring.mail.port=3025

# Reduce noise in test output
spring.main.banner-mode=off
logging.level.org.springframework=WARN
logging.level.org.mongodb.driver=WARN